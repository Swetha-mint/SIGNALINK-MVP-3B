<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIGNALINK MVP-3B — Recovery FSM</title><link rel="stylesheet" href="style.css"></head><body><main><header><p class="eyebrow">SIGNALINK · MVP-3B</p><h1>Fault-Tolerant Communication</h1><p>Inject valid or corrupted communication events and observe deterministic recovery.</p></header><section class="card"><div class="buttons"><button data-event="HELLO">HELLO</button><button data-event="YES">YES</button><button data-event="STOP">STOP</button><button data-event="NOISE" class="secondary">NOISE</button><button id="clear" class="secondary">CLEAR</button></div><div class="grid"><div><small>STATE</small><strong id="state">IDLE</strong></div><div><small>RECOVERY</small><strong id="recovery">NONE</strong></div><div><small>VALID EVENTS</small><strong id="count">0</strong></div></div></section><section class="card"><p class="eyebrow">COMMUNICATION REGISTER</p><pre id="register">[ empty ]</pre><p id="status">Ready.</p></section><section class="card"><p class="eyebrow">EVENT LOG</p><ol id="log"></ol></section><footer>FSM recovery simulation · No ML · No hardware</footer></main><script src="script.js"></script></body></html>
